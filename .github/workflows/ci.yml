name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python scripts/check_size.py
      - run: uv run pytest -q
      - run: git diff --check

  # Exact-base Pyright gate: fails only on findings the PR adds versus its merge base, matched
  # by (file, rule, message, source line text) rather than line number. Limitation: the
  # comparison script comes from the base when it has one, so a PR cannot weaken its own gate;
  # only the PR that introduces scripts/pyright_gate.py is judged by its own copy.
  pyright:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Pyright on the merge base and on the head
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_sha=$(git merge-base "origin/${BASE_REF}" HEAD)
          echo "merge base: $base_sha"
          git worktree add "$RUNNER_TEMP/base" "$base_sha"
          # pyright exits 0 (clean) or 1 (findings); the gate judges findings, any other
          # exit code (crash, bad config, usage) fails this step.
          run_pyright() {
            (cd "$1" && uv sync --locked)
            local rc=0
            (cd "$1" && uvx --from pyright==1.1.414 pyright --pythonpath .venv/bin/python \
              --outputjson > "$2") || rc=$?
            if [ "$rc" -gt 1 ]; then echo "pyright exited $rc in $1"; exit 1; fi
          }
          run_pyright "$RUNNER_TEMP/base" "$RUNNER_TEMP/base.json"
          run_pyright "$GITHUB_WORKSPACE" "$RUNNER_TEMP/head.json"
          gate="$RUNNER_TEMP/base/scripts/pyright_gate.py"
          [ -f "$gate" ] || gate=scripts/pyright_gate.py
          python3 "$gate" "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/base" \
            "$RUNNER_TEMP/head.json" "$GITHUB_WORKSPACE"

  # The verifier sandbox (macOS Seatbelt) is only proven on macOS. Nexus-new's
  # sandbox could not run pytest for weeks because nothing ran it for real, so
  # this job cannot skip: a missing sandbox-exec fails it.
  test-macos:
    runs-on: macos-latest
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
      CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed without sandbox-exec
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1) (allow default)' /usr/bin/true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Create the verifier account (Issue #9)
        run: |
          sudo zsh scripts/setup_verifier_user.sh "$USER"
          zsh scripts/setup_verifier_python.sh
      - run: uv run pytest -q

  # P2 draft (Linux bwrap, probe only). This job observes how bwrap behaves on a
  # GitHub ubuntu-24.04 runner — where an AppArmor rule restricts capability-bearing
  # user namespaces by default — before the policy/wrap backend and witness tests are
  # written. It prints available() before and after lifting the restriction and runs
  # the same unguarded namespace probe (unguarded on purpose: a host that cannot nest
  # namespaces reddens the leg rather than letting sandbox tests skip silently).
  test-linux-sandbox:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: The default AppArmor userns restriction must make the probe fail closed
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; assert bwrap.available() is False, 'restricted host must not be available'"
      - name: Lift the restriction (end users load an AppArmor profile instead)
        run: |
          # || true: an older kernel may lack this key. If the lift silently fails the next
          # step's assert that available() is True reddens with a clear message instead.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: The probe must pass once the restriction is lifted
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; assert bwrap.available() is True, 'lifted host must be available'"
      - name: Gate — bwrap must be able to nest namespaces (unguarded)
        run: bwrap --unshare-pid --unshare-user --cap-drop ALL --ro-bind / / --proc /proc true
      - name: Sandbox witnesses on real bwrap
        run: CAIRNWORK_REQUIRE_SANDBOX=1 uv run pytest -q tests/test_sandbox.py
