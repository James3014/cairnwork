name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python scripts/check_size.py
      - run: uv run pytest -q
      - run: git diff --check

  # The verifier sandbox (macOS Seatbelt) is only proven on macOS. Nexus-new's
  # sandbox could not run pytest for weeks because nothing ran it for real, so
  # this job cannot skip: a missing sandbox-exec fails it.
  test-macos:
    runs-on: macos-latest
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
      CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed without sandbox-exec
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1) (allow default)' /usr/bin/true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Create the verifier account (Issue #9)
        run: |
          sudo zsh scripts/setup_verifier_user.sh "$USER"
          zsh scripts/setup_verifier_python.sh
      - run: uv run pytest -q

  # P2 draft (Linux bwrap, probe only). This job observes how bwrap behaves on a
  # GitHub ubuntu-24.04 runner — where an AppArmor rule restricts capability-bearing
  # user namespaces by default — before the policy/wrap backend and witness tests are
  # written. It prints available() before and after lifting the restriction and runs
  # the same unguarded namespace probe (unguarded on purpose: a host that cannot nest
  # namespaces reddens the leg rather than letting sandbox tests skip silently).
  test-linux-sandbox:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: Observe the probe under the default AppArmor userns restriction
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; print('restricted available():', bwrap.available())"
      - name: Lift the restriction (end users load an AppArmor profile instead)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Observe the probe after lifting the restriction
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; print('lifted available():', bwrap.available())"
      - name: Gate — bwrap must be able to nest namespaces (unguarded)
        run: bwrap --unshare-pid --unshare-user --cap-drop ALL --ro-bind / / --proc /proc true
