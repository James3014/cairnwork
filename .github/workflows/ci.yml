name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python scripts/check_size.py
      - run: uv run pytest -q
      - run: git diff --check

  # Exact-base Pyright gate: fails only on findings the PR adds versus its merge base, matched
  # by (file, rule, message, source line text) rather than line number. Limitation: the
  # comparison script comes from the PR head (the base has none on the first PR), so a PR that
  # edits scripts/pyright_gate.py is judged by its own copy; review that file by hand.
  pyright:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Pyright on the merge base and on the head
        run: |
          base_sha=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "merge base: $base_sha"
          git worktree add "$RUNNER_TEMP/base" "$base_sha"
          # pyright exits 1 when it has findings; the gate decides, so tolerate that here.
          run_pyright() {
            (cd "$1" && uv sync --locked &&
              { uvx --from pyright==1.1.414 pyright --pythonpath .venv/bin/python --outputjson \
                > "$2" || true; })
          }
          run_pyright "$RUNNER_TEMP/base" "$RUNNER_TEMP/base.json"
          run_pyright "$GITHUB_WORKSPACE" "$RUNNER_TEMP/head.json"
          python3 scripts/pyright_gate.py "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/base" \
            "$RUNNER_TEMP/head.json" "$GITHUB_WORKSPACE"

  # The verifier sandbox (macOS Seatbelt) is only proven on macOS. Nexus-new's
  # sandbox could not run pytest for weeks because nothing ran it for real, so
  # this job cannot skip: a missing sandbox-exec fails it.
  test-macos:
    runs-on: macos-latest
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
      CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed without sandbox-exec
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1) (allow default)' /usr/bin/true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Create the verifier account (Issue #9)
        run: |
          sudo zsh scripts/setup_verifier_user.sh "$USER"
          zsh scripts/setup_verifier_python.sh
      - run: uv run pytest -q
