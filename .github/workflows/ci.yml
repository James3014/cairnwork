name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python scripts/check_size.py
      - run: uv run pytest -q
      - run: git diff --check

  # The exact-base Pyright gate runs from the default branch (pyright-trusted.yml, Issue #66):
  # a PR-owned job could be edited away, so it is not defined here.

  # The verifier sandbox (macOS Seatbelt) is only proven on macOS. Nexus-new's
  # sandbox could not run pytest for weeks because nothing ran it for real, so
  # this job cannot skip: a missing sandbox-exec fails it.
  test-macos:
    runs-on: macos-latest
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
      CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed without sandbox-exec
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1) (allow default)' /usr/bin/true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Create the verifier account (Issue #9)
        run: |
          sudo zsh scripts/setup_verifier_user.sh "$USER"
          zsh scripts/setup_verifier_python.sh
      - run: uv run pytest -q

  # P2 draft (Linux bwrap, probe only). This job observes how bwrap behaves on a
  # GitHub ubuntu-24.04 runner — where an AppArmor rule restricts capability-bearing
  # user namespaces by default — before the policy/wrap backend and witness tests are
  # written. It prints available() before and after lifting the restriction and runs
  # the same unguarded namespace probe (unguarded on purpose: a host that cannot nest
  # namespaces reddens the leg rather than letting sandbox tests skip silently).
  test-linux-sandbox:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: The default AppArmor userns restriction must make the probe fail closed
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; assert bwrap.available() is False, 'restricted host must not be available'"
      - name: Lift the restriction (end users load an AppArmor profile instead)
        run: |
          # || true: an older kernel may lack this key. If the lift silently fails the next
          # step's assert that available() is True reddens with a clear message instead.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: The probe must pass once the restriction is lifted
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; assert bwrap.available() is True, 'lifted host must be available'"
      - name: Gate — bwrap must be able to nest namespaces (unguarded)
        run: bwrap --unshare-pid --unshare-user --cap-drop ALL --ro-bind / / --proc /proc true
      - name: Sandbox witnesses on real bwrap
        run: CAIRNWORK_REQUIRE_SANDBOX=1 uv run pytest -q tests/test_sandbox.py

  # Linux P4 (Issue #84): verifiers run as a dedicated unprivileged account, as on macOS.
  # Creates the account, then runs the account witnesses on real bwrap with the account
  # required — a missing or unusable account fails the job (it cannot silently skip).
  test-linux-verifier-account:
    runs-on: ubuntu-24.04
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
      CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT: "1"
      CAIRNWORK_VERIFIER_ROOT: "/var/lib/cairnwork"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install bubblewrap and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap zsh
          bwrap --version
      - name: Lift the AppArmor userns restriction (end users load a profile instead)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Create the verifier account (Issue #84) and its Python
        run: |
          sudo sh scripts/setup_verifier_user_linux.sh "$USER"
          zsh scripts/setup_verifier_python.sh
      - name: Account witnesses on real bwrap, as the dedicated account
        run: uv run pytest -q -m verifier_account
